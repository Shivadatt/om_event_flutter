  <!-- Suppress CanvasKit WebGL context-lost race during hot restarts -->
  <script>
    window.addEventListener('webglcontextlost', function(e) {
      e.preventDefault();
    }, true);
    window.addEventListener('error', function(e) {
      if (e && e.message && (e.message.indexOf('_handledContextLostEvent') !== -1 || e.message.indexOf('webglcontextlost') !== -1)) {
        e.stopImmediatePropagation();
        e.preventDefault();
        return true;
      }
    });
    window.addEventListener('unhandledrejection', function(e) {
      if (!e.reason || (e.reason && (e.reason.name === 'AbortError' || e.reason.message === 'Failed to fetch'))) {
        e.preventDefault();
      }
    });
    if (typeof console !== 'undefined' && console.error) {
      const _origError = console.error;
      console.error = function(...args) {
        const msg = args.join(' ');
        if (msg.indexOf('_handledContextLostEvent') !== -1 || msg.indexOf('webglcontextlost') !== -1) {
          return;
        }
        _origError.apply(console, args);
      };
    }
  </script>

  <script>
    // Immediately apply cached dynamic favicon before Flutter engine boots to prevent default icon flicker
    try {
      var cachedStr = localStorage.getItem('flutter.cached_business_details');
      if (cachedStr) {
        var cached = JSON.parse(cachedStr);
        var fav = (cached.general && cached.general.favicon) || cached.favicon;
        if (fav && typeof fav === 'string' && fav.trim().startsWith('http')) {
          var links = document.querySelectorAll('link[rel="icon"], link[rel="shortcut icon"]');
          links.forEach(function(el) { el.href = fav.trim(); });
        }
      }
    } catch (_) {}
  </script>

  <!-- Inline critical CSS for splash: zero external requests, renders instantly -->
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;height:100%;background:#0F0D0B;overflow:hidden}
    #flutter-loading-screen{
      position:fixed;
      inset:0;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      background: radial-gradient(circle at center, #1E1A16 0%, #0F0D0B 100%);
      z-index:9999;
      transition:opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
    }
    
    /* Video background during initial HTML load — local-first, zero black gap */
    video#splash-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
      opacity: 1;
    }

    .splash-overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      background: radial-gradient(circle at center, rgba(15, 13, 11, 0.15) 0%, rgba(15, 13, 11, 0.55) 100%);
      pointer-events: none;
    }

    #flutter-loading-screen.hidden{opacity:0;pointer-events:none}
  </style>
</head>
<body>
  <!-- Native splash shown immediately — zero flicker, luxury gold & black identity -->
  <div id="flutter-loading-screen" aria-label="Loading Om Events…" role="progressbar">
    <!-- Video background loaded immediately locally with remote fallback -->
    <video id="splash-video" src="splash_screen.mp4" poster="splash_poster.jpg" autoplay muted loop playsinline preload="auto">
      <source src="splash_screen.mp4" type="video/mp4">
      <source src="assets/videos/splash_screen.mp4" type="video/mp4">
      <source src="https://kwegyvbgdaednljyhcgm.supabase.co/storage/v1/object/public/gallery/Video/splash_screen.mp4" type="video/mp4">
    </video>
    <div class="splash-overlay"></div>
  </div>

  <script>
    var splashRemoved = false;

    function removeSplash() {
      if (!splashRemoved) {
        splashRemoved = true;
        var splash = document.getElementById('flutter-loading-screen');
        if (splash) {
          splash.classList.add('hidden');
          setTimeout(function () { splash.remove(); }, 500);
        }
      }
    }

    // Ensure HTML splash video starts playing immediately on reload
    (function() {
      var v = document.getElementById('splash-video');
      if (v) {
        v.muted = true;
        v.defaultMuted = true;
        v.playsInline = true;
        v.setAttribute('playsinline', '');
        v.setAttribute('webkit-playsinline', '');
        var p = v.play();
        if (p !== undefined) {
          p.catch(function(err) {
            console.log("HTML splash autoplay info: ", err);
          });
        }
      }
    })();

    // Ensure splash is not removed prematurely before Flutter's surface finishes rendering
    window.addEventListener('flutter-first-frame', function() {
      setTimeout(removeSplash, 400);
    });

    // Safety fallback in case flutter-first-frame is delayed
    window.addEventListener('load', function() {
      setTimeout(removeSplash, 4000);
    });
  </script>

  <!-- Push notifications are disabled in feature flags; service worker registration skipped for performance -->

  <script src="flutter_bootstrap.js" async></script>
</body>
