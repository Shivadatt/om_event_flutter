  <!-- Suppress CanvasKit WebGL context-lost race during hot restarts -->
  <script>
    window.addEventListener('webglcontextlost', function(e) {
      e.preventDefault();
    }, true);
    window.addEventListener('error', function(e) {
      if (e && e.message && (e.message.indexOf('_handledContextLostEvent') !== -1 || e.message.indexOf('webglcontextlost') !== -1)) {
        e.stopImmediatePropagation();
        e.preventDefault();
        return true;
      }
    });
    if (typeof console !== 'undefined' && console.error) {
      const _origError = console.error;
      console.error = function(...args) {
        const msg = args.join(' ');
        if (msg.indexOf('_handledContextLostEvent') !== -1 || msg.indexOf('webglcontextlost') !== -1) {
          return;
        }
        _origError.apply(console, args);
      };
    }
  </script>

  <!-- Inline critical CSS for splash: zero external requests, renders instantly -->
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;height:100%;background:#0F0D0B;overflow:hidden}
    #flutter-loading-screen{
      position:fixed;
      inset:0;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      background: #0F0D0B;
      z-index:9999;
      transition:opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
    }
    
    .splash-brand {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 24px;
    }
    .splash-title {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 5px;
      color: #D4AF37;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .splash-subtitle {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 3px;
      color: rgba(255, 255, 255, 0.7);
      text-transform: uppercase;
      margin-bottom: 24px;
    }
    .splash-bar {
      width: 140px;
      height: 2px;
      background: rgba(212, 175, 55, 0.2);
      border-radius: 2px;
      overflow: hidden;
      position: relative;
    }
    .splash-progress {
      width: 50%;
      height: 100%;
      background: #D4AF37;
      border-radius: 2px;
      animation: splash-shimmer 1.4s ease-in-out infinite;
    }
    @keyframes splash-shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(250%); }
    }

    /* Optional video background (lazy loaded, non-blocking) */
    video#splash-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
      opacity: 0.6;
    }

    #flutter-loading-screen.hidden{opacity:0;pointer-events:none}
  </style>
</head>
<body>
  <!-- Native splash shown immediately — zero flicker, luxury gold & black identity -->
  <div id="flutter-loading-screen" aria-label="Loading Om Events…" role="progressbar">
    <div class="splash-brand">
      <div class="splash-title">OM EVENTS</div>
      <div class="splash-subtitle">Celebrations, thoughtfully composed</div>
      <div class="splash-bar"><div class="splash-progress"></div></div>
    </div>
    <!-- Video background loaded asynchronously without blocking Flutter initialization -->
    <video id="splash-video" autoplay muted playsinline preload="none">
      <source src="https://kwegyvbgdaednljyhcgm.supabase.co/storage/v1/object/public/gallery/Video/splash_screen.mp4" type="video/mp4">
    </video>
  </div>

  <script>
    var splashRemoved = false;

    function removeSplash() {
      if (!splashRemoved) {
        splashRemoved = true;
        var splash = document.getElementById('flutter-loading-screen');
        if (splash) {
          splash.classList.add('hidden');
          setTimeout(function () { splash.remove(); }, 500);
        }
      }
    }

    // Immediately remove splash once Flutter engine renders its first frame (zero artificial delay)
    window.addEventListener('flutter-first-frame', function() {
      removeSplash();
    });

    // Safety fallback in case flutter-first-frame is delayed or missed
    window.addEventListener('load', function() {
      setTimeout(removeSplash, 4000);
    });
  </script>

  <!-- Push notifications are disabled in feature flags; service worker registration skipped for performance -->

  <script src="flutter_bootstrap.js" async></script>
</body>
